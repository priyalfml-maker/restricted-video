<!DOCTYPE html>
<html>
<head>
  <title>Access Denied</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding-top: 180px;
    }

    .box {
      background: white;
      display: inline-block;
      padding: 45px 60px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    h1 {
      font-size: 32px;
    }

    p {
      color: #666;
      font-size: 16px;
    }

    .error {
      color: #999;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Access Denied</h1>
    <p>You do not have permission to access this video.</p>
    <div class="error">Error 403 — Access Denied</div>
  </div>
</body>
</html>
